name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (ruff + pytest + coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check app tests
      - name: Format
        run: ruff format --check app tests
      - name: Tests
        run: pytest -q --cov=app --cov-report=term-missing:skip-covered --cov-fail-under=70

  frontend:
    name: Frontend (lint + typecheck + vitest + build)
    runs-on: ubuntu-latest
    outputs:
      playwright_version: ${{ steps.playwright.outputs.version }}
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Resolve Playwright container version
        id: playwright
        run: node -p "'version=' + require('@playwright/test/package.json').version" >> "$GITHUB_OUTPUT"
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit/integration tests
        run: npm run test:coverage
      - name: Build
        run: npm run build

  mobile:
    name: Mobile (npm ci + typecheck)
    runs-on: ubuntu-latest
    env:
      EXPO_OFFLINE: "1"
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - name: Check runtime dependency peers
        run: npm ls @clerk/expo expo react react-dom react-native
      - name: Check Expo native module versions
        run: npx expo install --check expo-application expo-auth-session expo-constants expo-crypto expo-document-picker expo-image-picker expo-local-authentication expo-secure-store expo-status-bar expo-web-browser @react-native-async-storage/async-storage
      - name: Typecheck
        run: npm run typecheck
      - name: Mobile regression tests
        run: npm test
      - name: Bundle Android and iOS
        run: npx expo export --platform android --platform ios --output-dir dist-ci

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-24.04
    needs: frontend
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.frontend.outputs.playwright_version }}-noble
      options: --ipc=host
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Run E2E
        run: npm run e2e -- --workers=1 --global-timeout=600000
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
