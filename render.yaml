# Render Blueprint — backend do Story R Us (api + worker + Postgres).
# Como usar: no Render -> New -> Blueprint -> conecte o repo. Ele cria tudo.
# Depois preencha as variaveis sync:false (IA, storage, Opik, credits, etc.) no painel.
# Redis e OPCIONAL (REDIS_URL sync:false): sem ele, o worker faz polling do banco.
# API always-on; banco e worker mantêm os planos atuais (DEPLOY.md).

databases:
  - name: storyrus-db
    plan: free
    databaseName: stories
    user: stories

services:
  # ---- API (FastAPI) ----
  - type: web
    name: storyrus-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: 0.5c-512mb
    healthCheckPath: /health
    dockerCommand: sh start-api.sh
    envVars:
      - key: APP_ENV
        value: prod
      - key: LOG_FORMAT
        value: json
      - key: SESSION_RESUME_RATE_LIMIT_PER_IP
        value: "120"
      - key: SESSION_RESUME_RATE_LIMIT_PER_USER
        value: "30"
      - key: SESSION_RESUME_RATE_LIMIT_WINDOW_S
        value: "60"
      # Worker free dorme. A API processa a fila enquanto o estúdio faz polling.
      - key: API_JOB_PUMP
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: storyrus-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_WEBHOOK_SECRET
        sync: false
      - key: WEBHOOK_SIGNING_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: IMAGE_PROVIDER
        value: openai
      - key: OFFLINE_FALLBACK
        value: "false"
      - key: AVATAR_FACE_MATCH
        value: "false"
      - key: TEXT_PROVIDER
        value: openai
      - key: KLING_API_KEY
        sync: false
      - key: KLING_ACCESS_KEY
        sync: false
      - key: KLING_SECRET_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: CREDIT_GRANT_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: PUBLIC_WEB_ORIGIN
        value: https://storyrus.ai
      # From precisa bater com domínio verificado no Resend (não mexer no MX do M365).
      - key: TRANSACTIONAL_FROM_EMAIL
        value: "Story R Us <noreply@storyrus.ai>"
      - key: OPIK_API_KEY
        sync: false
      - key: OPIK_WORKSPACE
        sync: false
      - key: OPIK_PROJECT_NAME
        sync: false
      - key: REDIS_URL
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ENDPOINT_URL
        sync: false
      - key: STORAGE_PUBLIC_ENDPOINT_URL
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: USAGE_DASHBOARD_PASSWORD
        sync: false
      - key: USAGE_DASHBOARD_PASSWORD_PREVIOUS
        sync: false
      - key: OWNER_EMAILS
        value: "eng.andrevitor89@gmail.com"
      # true = senha compartilhada ainda abre os painéis. false = só conta admin.
      - key: OWNER_PASSWORD_FALLBACK
        value: "true"
      # STO-18: teto diario da plataforma (0 = desligado)
      - key: DAILY_SPEND_USD_CEILING
        value: "0"
      - key: DAILY_CREDITS_CEILING
        value: "0"

  # ---- Worker (processa os jobs: personagem, historia, ebook, video) ----
  - type: worker
    name: storyrus-worker
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    dockerCommand: python -m app.workers.runner
    envVars:
      - key: APP_ENV
        value: prod
      - key: LOG_FORMAT
        value: json
      - key: DATABASE_URL
        fromDatabase:
          name: storyrus-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: IMAGE_PROVIDER
        value: openai
      - key: OFFLINE_FALLBACK
        value: "false"
      - key: AVATAR_FACE_MATCH
        value: "false"
      - key: TEXT_PROVIDER
        value: openai
      - key: KLING_API_KEY
        sync: false
      - key: KLING_ACCESS_KEY
        sync: false
      - key: KLING_SECRET_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: OPIK_API_KEY
        sync: false
      - key: OPIK_WORKSPACE
        sync: false
      - key: OPIK_PROJECT_NAME
        sync: false
      - key: REDIS_URL
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ENDPOINT_URL
        sync: false
      - key: STORAGE_PUBLIC_ENDPOINT_URL
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: USAGE_DASHBOARD_PASSWORD
        sync: false
      - key: USAGE_DASHBOARD_PASSWORD_PREVIOUS
        sync: false
      - key: OWNER_EMAILS
        value: "eng.andrevitor89@gmail.com"
      - key: DAILY_SPEND_USD_CEILING
        value: "0"
      - key: DAILY_CREDITS_CEILING
        value: "0"

# redeploy nudge 2026-10-07T12:25Z — pedidos gate + order tickets
