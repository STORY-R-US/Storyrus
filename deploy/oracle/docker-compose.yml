# Produção na Oracle Cloud (Ampere A1, Always Free).
# Postgres e Redis não publicam porta no host. Só o Caddy abre 80 e 443.
# Rode a partir desta pasta, com o .env preenchido (copie de env.example).

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: stories
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: stories
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stories"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped

  api:
    build:
      context: ../../backend
      dockerfile: Dockerfile
      args:
        INSTALL_FACE: "true"
    env_file: .env
    restart: unless-stopped
    environment:
      APP_ENV: prod
      DATABASE_URL: postgresql+psycopg://stories:${POSTGRES_PASSWORD}@db:5432/stories
      REDIS_URL: redis://redis:6379/0
      EMBED_WORKER: "false"
      INSIGHTFACE_ENABLED: "true"
    volumes:
      - insightface:/root/.insightface
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    expose:
      - "8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build:
      context: ../../backend
      dockerfile: Dockerfile
      args:
        INSTALL_FACE: "true"
    env_file: .env
    restart: unless-stopped
    environment:
      APP_ENV: prod
      DATABASE_URL: postgresql+psycopg://stories:${POSTGRES_PASSWORD}@db:5432/stories
      REDIS_URL: redis://redis:6379/0
      EMBED_WORKER: "false"
      INSIGHTFACE_ENABLED: "true"
    volumes:
      - insightface:/root/.insightface
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: ["python", "-m", "app.workers.runner"]

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      CADDY_EMAIL: ${CADDY_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  insightface:
  caddy_data:
  caddy_config:
