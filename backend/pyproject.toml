[project]
name = "storyrus-api"
version = "0.1.0"
description = "Story R Us — API core (foto -> personagem -> ebook -> video)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "bcrypt<5",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "boto3>=1.34",
    "redis>=5.0",
    "pypdf>=4.2",
    "python-docx>=1.1",
    "reportlab>=4.1",
    "edge-tts>=6.1",
    "pillow>=10.4",
    "tzdata>=2024.1",
    "fal-client>=0.5",
    "insightface>=0.7",
    "onnxruntime>=1.18",
    "opencv-python-headless>=4.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Conjunto estável (o ruff recente liga dezenas de regras extras por padrão).
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E702", "E731"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.coverage.run]
branch = false
source = ["app"]
omit = ["app/ai_clients/text_anthropic.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 70

[tool.setuptools.packages.find]
include = ["app*"]
