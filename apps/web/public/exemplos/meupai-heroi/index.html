<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Meu Pai, Meu Herói — Story R Us</title>
  <style>
    :root {
      --ink: #0f2a4a;
      --sky: #dceefc;
      --paper: #f7fbff;
      --accent: #1d4f91;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse at top, #fff 0%, var(--sky) 45%, #b7d7f2 100%);
      display: grid;
      place-items: center;
      padding: 24px 16px 40px;
    }
    .wrap { width: min(720px, 100%); text-align: center; }
    h1 {
      margin: 0 0 6px;
      font-size: clamp(1.4rem, 4vw, 2rem);
      letter-spacing: 0.02em;
    }
    .sub { margin: 0 0 18px; opacity: 0.75; }
    .stage {
      position: relative;
      margin: 0 auto;
      width: min(560px, 92vw);
      aspect-ratio: 1;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 18px 50px rgba(15, 42, 74, 0.28);
      background: #fff;
    }
    .stage img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }
    .nav {
      display: flex;
      gap: 12px;
      justify-content: center;
      align-items: center;
      margin-top: 18px;
      flex-wrap: wrap;
    }
    button, a.btn {
      appearance: none;
      border: 0;
      border-radius: 999px;
      padding: 12px 20px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
    }
    button:disabled { opacity: 0.4; cursor: default; }
    button.ghost, a.ghost {
      background: #fff;
      color: var(--accent);
      box-shadow: inset 0 0 0 2px var(--accent);
    }
    .count { min-width: 7ch; font-variant-numeric: tabular-nums; font-weight: 700; }
    .dots {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      margin-top: 14px;
      max-width: 560px;
      margin-left: auto;
      margin-right: auto;
    }
    .dots button {
      width: 10px;
      height: 10px;
      padding: 0;
      border-radius: 50%;
      background: rgba(29, 79, 145, 0.28);
    }
    .dots button.on { background: var(--accent); transform: scale(1.2); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Meu Pai, Meu Herói</h1>
    <p class="sub">Folheie o livro completo · 16 páginas + capa e contracapa</p>
    <div class="stage" id="stage"><img id="page" alt="Página do livro" /></div>
    <div class="nav">
      <button type="button" id="prev" aria-label="Página anterior">‹ Anterior</button>
      <span class="count" id="count">1 / 17</span>
      <button type="button" id="next" aria-label="Próxima página">Próxima ›</button>
      <a class="btn ghost" href="../ebook-meupai-heroi.pdf" download>Baixar PDF</a>
      <a class="btn ghost" href="../ebook-meupai-heroi-miolo-fogra32-300dpi.pdf" download>Miolo FOGRA32</a>
      <a class="btn ghost" href="../ebook-meupai-heroi-capa-dura-fogra32-300dpi.pdf" download>Capa dura FOGRA32</a>
      <a class="btn ghost" href="../ebook-meupai-heroi-capa-mole-fogra32-300dpi.pdf" download>Capa mole FOGRA32</a>
      <a class="btn ghost" href="../video-meupai-heroi.mp4" download>Baixar vídeo</a>
    </div>
    <div class="dots" id="dots" role="tablist" aria-label="Páginas"></div>
  </div>
  <script>
    const pages = [
      "capa.png",
      "pagina-02.jpg","pagina-03.jpg","pagina-04.jpg","pagina-05.jpg",
      "pagina-06.jpg","pagina-07.jpg","pagina-08.jpg","pagina-09.jpg",
      "pagina-10.jpg","pagina-11.jpg","pagina-12.jpg","pagina-13.jpg",
      "pagina-14.jpg","pagina-15.jpg","pagina-16.jpg",
      "contracapa.jpg",
    ];
    let i = 0;
    const img = document.getElementById("page");
    const count = document.getElementById("count");
    const prev = document.getElementById("prev");
    const next = document.getElementById("next");
    const dots = document.getElementById("dots");
    pages.forEach((_, idx) => {
      const b = document.createElement("button");
      b.type = "button";
      b.setAttribute("aria-label", "Ir para página " + (idx + 1));
      b.addEventListener("click", () => show(idx));
      dots.appendChild(b);
    });
    function show(n) {
      i = (n + pages.length) % pages.length;
      img.src = pages[i];
      count.textContent = (i + 1) + " / " + pages.length;
      prev.disabled = false;
      next.disabled = false;
      [...dots.children].forEach((d, idx) => d.classList.toggle("on", idx === i));
    }
    prev.addEventListener("click", () => show(i - 1));
    next.addEventListener("click", () => show(i + 1));
    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") show(i - 1);
      if (e.key === "ArrowRight") show(i + 1);
    });
    let touchX = null;
    document.getElementById("stage").addEventListener("touchstart", (e) => {
      touchX = e.changedTouches[0].clientX;
    }, { passive: true });
    document.getElementById("stage").addEventListener("touchend", (e) => {
      if (touchX == null) return;
      const dx = e.changedTouches[0].clientX - touchX;
      if (Math.abs(dx) > 40) show(i + (dx < 0 ? 1 : -1));
      touchX = null;
    }, { passive: true });
    show(0);
  </script>
</body>
</html>
